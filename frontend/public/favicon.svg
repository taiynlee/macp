<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- octagon background -->
  <polygon points="10,2 22,2 30,10 30,22 22,30 10,30 2,22 2,10"
           fill="#0f1520" stroke="#22d3ee" stroke-width="1.5"/>
  <!-- three dots representing agents -->
  <circle cx="9"  cy="16" r="2.8" fill="#22d3ee"/>
  <circle cx="16" cy="10" r="2.8" fill="#a78bfa"/>
  <circle cx="23" cy="16" r="2.8" fill="#34d399"/>
  <!-- connecting lines -->
  <line x1="9"  y1="16" x2="16" y2="10" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="10" x2="23" y2="16" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <line x1="9"  y1="16" x2="23" y2="16" stroke="#34d399" stroke-width="1" opacity="0.5"/>
</svg>
